name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write     # required to get the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest   # your runner labels
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}          # UAMI client ID (not a secret!)
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure commands
        run: |
          az account show
          az group list
